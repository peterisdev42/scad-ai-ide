<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{csp}}; script-src 'nonce-{{nonce}}';" />
        <link rel="stylesheet" href="{{style}}" />
        <title>{{title}}</title>
    </head>
    <body data-page="{{page}}">
        <main>
            <header>
                <h1>{{title}}</h1>
                <p id="summary"></p>
            </header>
            <section id="runtime" hidden aria-label="OpenSCAD runtimes">
                <div class="toolbar">
                    <button data-action="refresh">Refresh</button>
                    <button data-action="browse">Add Runtime</button>
                    <button data-action="automatic">Use Automatic Discovery</button>
                    <button data-action="diagnostics" class="secondary">Diagnostics</button>
                </div>
                <p id="status" role="status" aria-live="polite"></p>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Version</th>
                                <th>Source</th>
                                <th>Executable</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="runtimes"></tbody>
                    </table>
                </div>
            </section>
            <section id="placeholder" hidden>
                <h2 id="placeholder-heading"></h2>
                <p>This feature is not available yet.</p>
            </section>
        </main>
        <script nonce="{{nonce}}" src="{{script}}"></script>
    </body>
</html>
