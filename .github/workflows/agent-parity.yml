name: Agent capability parity
on:
    push:
    pull_request:
permissions:
    contents: read
jobs:
    contracts:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
              with:
                  # The architecture gate compares against the fixed audit SHA.
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm
            - run: npm ci
            - run: npm run test:agents:manifest
            - run: npm run check:agents
            - run: npm run check-types
            - run: npm run lint
            - run: npm run check:customizer:architecture
            - run: npm run test:customizer:compatibility
            - run: node --test out/test/customizer.test.js
            - run: npm run test:customizer:source
            - run: npm run test:mesh
            - run: npm run test:assembly
            - run: npm run test:cad:unit
            - run: npm run test:capabilities
            - run: npm run test:libraries
    panel:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm
            - run: npm ci
            - run: npx playwright install --with-deps chromium
            - run: npm run check:agents
            - run: npm run test:customizer
            - run: npm run test:agents:ui
            - run: npm run test:libraries:ui
