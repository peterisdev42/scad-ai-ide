name: Agent capability parity
on:
    push:
    pull_request:
permissions:
    contents: read
jobs:
    contracts:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm
            - run: npm ci
            - run: npm run check:agents
            - run: npm run check-types
            - run: npm run lint
            - run: npm run test:capabilities
            - run: npm run test:libraries
    panel:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm
            - run: npm ci
            - run: npx playwright install --with-deps chromium
            - run: npm run check:agents
            - run: npm run test:agents:ui
            - run: npm run test:libraries:ui
