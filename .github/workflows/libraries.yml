name: Library Manager
on:
    push:
    pull_request:
    workflow_dispatch:
        inputs:
            online:
                description: Run live Registry / BOSL2 integration
                type: boolean
                default: false
permissions:
    contents: read
jobs:
    libraries:
        strategy:
            fail-fast: false
            matrix:
                os: [macos-latest, ubuntu-latest, windows-2025]
        runs-on: ${{ matrix.os }}
        env:
            QT_QPA_PLATFORM: offscreen
            SCAD_REQUIRE_CLI: '1'
            SCAD_LIBRARIES_ONLINE: ${{ inputs.online && '1' || '0' }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm
            - run: npm ci
            - name: Install native graphics dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libegl1 libgl1 libopengl0 xvfb xauth
            - name: Install verified managed OpenSCAD CLI
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Stop'
                  $lock = Get-Content .github/runtime-cli-lock.json -Raw | ConvertFrom-Json -AsHashtable
                  $target = node -p 'process.platform + "-" + process.arch'
                  $asset = $lock.targets[$target]
                  if (!$asset) { throw "No native OpenSCAD CLI locked for $target" }
                  $archive = Join-Path $env:RUNNER_TEMP $asset.name
                  $runtime = Join-Path $env:RUNNER_TEMP 'customizer-native-runtime'
                  Invoke-WebRequest $asset.url -OutFile $archive
                  $checksumFile = "$archive.sha256"
                  Invoke-WebRequest "$($asset.url).sha256" -OutFile $checksumFile
                  $checksum = ((Get-Content $checksumFile -Raw).Trim() -split '\s+')[0]
                  $archiveHash = (Get-FileHash $archive -Algorithm SHA256).Hash
                  if ($checksum -ne $asset.archiveSha256 -or $archiveHash -ne $asset.archiveSha256) {
                      throw 'OpenSCAD archive checksum mismatch'
                  }
                  if ($target -eq 'win32-x64') {
                      Expand-Archive $archive -DestinationPath $runtime
                  } else {
                      New-Item -ItemType Directory -Path $runtime | Out-Null
                      tar -xzf $archive -C $runtime
                      if ($LASTEXITCODE -ne 0) { throw 'OpenSCAD archive extraction failed' }
                  }
                  $package = Join-Path $runtime ($asset.name -replace '\.(tar\.gz|zip)$', '')
                  $metadata = Get-Content (Join-Path $package 'build-info.json') -Raw | ConvertFrom-Json
                  if ($metadata.tag -ne $lock.tag -or $metadata.commit -ne $lock.upstreamCommit) {
                      throw 'OpenSCAD build provenance mismatch'
                  }
                  $binary = Join-Path $package $asset.binary
                  if ((Get-FileHash $binary -Algorithm SHA256).Hash -ne $asset.binarySha256) {
                      throw 'OpenSCAD binary checksum mismatch'
                  }
                  $executable = Join-Path $package $asset.executable
                  & $executable --version
                  if ($LASTEXITCODE -ne 0) { throw 'OpenSCAD version probe failed' }
                  "SCAD_OPENSCAD_EXECUTABLE=$executable" >> $env:GITHUB_ENV
            - run: npm run check-types
            - run: npm run lint
            - run: npm run compile-tests
            - name: Diagnose Windows Unicode library environment
              if: runner.os == 'Windows'
              shell: bash
              run: |
                  mkdir -p .build
                  node scripts/customizer-windows-environment-probe.mjs "$SCAD_OPENSCAD_EXECUTABLE" .build/customizer-windows-environment.json --strict
            - name: Check native Customizer parity
              if: always() && env.SCAD_OPENSCAD_EXECUTABLE != ''
              shell: bash
              run: |
                  mkdir -p .build
                  set -euo pipefail
                  node scripts/customizer-native-audit.mjs "$SCAD_OPENSCAD_EXECUTABLE" .build/customizer-native.json --strict
                  node scripts/customizer-native-import-audit.mjs "$SCAD_OPENSCAD_EXECUTABLE" .build/customizer-native-import.json
            - name: Run required native library gate
              if: always() && env.SCAD_OPENSCAD_EXECUTABLE != ''
              shell: bash
              run: |
                  set -euo pipefail
                  npm run test:libraries 2>&1 | tee .build/library-tests.log
            - name: Run required native CAD diagnostics gate
              if: always() && env.SCAD_OPENSCAD_EXECUTABLE != ''
              shell: bash
              run: |
                  set -euo pipefail
                  npm run test:cad:real 2>&1 | tee .build/cad-real.log
            - name: Run live Registry and offline recovery
              if: always() && inputs.online && env.SCAD_OPENSCAD_EXECUTABLE != ''
              shell: bash
              run: |
                  set -euo pipefail
                  npm run test:libraries:online 2>&1 | tee .build/library-online.log
            - name: Preserve native comparison
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: native-customizer-${{ runner.os }}
                  include-hidden-files: true
                  path: |
                      .build/customizer-native.json
                      .build/customizer-native-import.json
                      .build/customizer-windows-environment.json
                      .build/library-tests.log
                      .build/cad-real.log
                      .build/library-online.log
                  if-no-files-found: warn
            - name: Save test report context
              if: always()
              shell: bash
              run: node -p 'JSON.stringify({platform:process.platform,arch:process.arch,node:process.version})'
