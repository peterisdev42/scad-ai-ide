name: Deploy product website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/marketing/product-claims.json'
      - 'tools/pages-workbench/**'
      - 'syntaxes/openscad.tmLanguage.json'
      - 'src/features/preview/**'
      - 'src/core/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.webview.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked build dependencies
        run: npm ci --ignore-scripts
      - name: Install isolated Workbench dependencies
        run: npm install --prefix tools/pages-workbench --ignore-scripts --no-audit --no-fund
      - name: Install OpenSCAD for source preview generation
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openscad
      - name: Bundle actual Preview and Code-OSS Workbench
        run: node site/build-demo.mjs
      - name: Verify site
        run: |
          test -s site/index.html
          test -s site/styles.css
          test -s site/main.js
          test -s site/demo/preview-host.js
          test -s site/workbench.css
          test -s site/assets/cheese.scad
          test -s site/demo.test.mjs
          test -s site/assets/cheese.png
          test -s site/content.css
          test -s site/sitemap.xml
          test -s site/llms.txt
          test -s site/for-beginners/index.html
          test -s site/for-ai-agents/index.html
          test -s site/why-scad-ai-ide/index.html
          test -s site/getting-started/index.html
          test -s site/favicon.svg
          node --check site/main.js
          node --check site/geist/theme.js
          node --check site/demo/preview-host.js
          node --check site/build-og.mjs
          node --check site/seo.test.mjs
          node site/build-og.mjs
          node --test site/demo.test.mjs site/seo.test.mjs site/geist.test.mjs
      - name: Install Chromium for website validation
        run: npx playwright install --with-deps chromium
      - name: Verify responsive website before deployment
        run: node --test site/website.browser.test.mjs
      - name: Verify real Workbench startup, refresh and Preview before deployment
        run: node --test site/demo/browser.test.mjs
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-browser-diagnostics
          path: site-demo-*.png
          if-no-files-found: ignore
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      # Upload finalization can precede artifact-list visibility. Gate deployment
      # on this run's exact artifact, not just any artifact with the same name.
      - name: Wait for Pages artifact availability
        timeout-minutes: 3
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          if [[ ! "$ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Pages upload did not return a valid artifact ID."
            exit 1
          fi

          for attempt in {1..12}; do
            if artifacts=$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              -f name=github-pages -f per_page=100) &&
              jq -e --arg id "$ARTIFACT_ID" '
                [.artifacts[] | select(.name == "github-pages" and .expired == false)]
                | length == 1 and (.[0].id | tostring) == $id
              ' <<< "$artifacts" > /dev/null; then
              echo "Pages artifact $ARTIFACT_ID is visible (attempt $attempt/12)."
              # deploy-pages uses a separate internal artifact listing service.
              sleep 5
              exit 0
            fi

            echo "Pages artifact $ARTIFACT_ID is not ready (attempt $attempt/12)."
            if (( attempt < 12 )); then sleep 5; fi
          done

          echo "::error::Pages artifact $ARTIFACT_ID did not become uniquely visible in this workflow run."
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
