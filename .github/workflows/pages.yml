name: Deploy product website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/features/preview/**'
      - 'src/core/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.webview.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked build dependencies
        run: npm ci --ignore-scripts
      - name: Bundle actual Preview and Monaco
        run: node site/build-demo.mjs
      - name: Verify site
        run: |
          test -s site/index.html
          test -s site/styles.css
          test -s site/main.js
          test -s site/workbench.js
          test -s site/workbench.css
          test -s site/assets/cheese.stl
          test -s site/assets/cheese.scad
          test -s site/demo.test.mjs
          test -s site/assets/cheese.png
          test -s site/content.css
          test -s site/sitemap.xml
          test -s site/llms.txt
          test -s site/for-beginners/index.html
          test -s site/for-ai-agents/index.html
          test -s site/why-scad-ai-ide/index.html
          test -s site/getting-started/index.html
          test -s site/favicon.svg
          node --check site/main.js
          node --check site/workbench.js
          node --check site/build-og.mjs
          node --check site/seo.test.mjs
          node site/build-og.mjs
          node --test site/demo.test.mjs site/seo.test.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
