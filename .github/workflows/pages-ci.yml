name: Validate product website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/pages-workbench/**'
      - '.github/workflows/pages-ci.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'tools/pages-workbench/**'
      - 'syntaxes/openscad.tmLanguage.json'
      - 'src/features/preview/**'
      - 'src/test/preview/threeMfAppearance.test.ts'
      - 'src/core/**'
      - 'package-lock.json'
      - 'tsconfig.webview.json'
      - 'README.md'
      - 'docs/marketing/**'
      - 'docs/agent-capability-catalog.md'
      - 'package.json'
      - '.github/workflows/pages-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked build dependencies
        run: npm ci --ignore-scripts
      - name: Test shared 3MF studio appearance
        run: node --import tsx --test src/test/preview/threeMfAppearance.test.ts
      - name: Install isolated Workbench dependencies
        run: npm install --prefix tools/pages-workbench --ignore-scripts --no-audit --no-fund
      - name: Install OpenSCAD for source preview generation
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openscad
      - name: Bundle actual Preview and Code-OSS Workbench
        run: node site/build-demo.mjs
      - name: Validate site and generated social asset
        run: |
          node --check site/main.js
          node --check site/geist/theme.js
          node --check site/demo/preview-host.js
          node --check site/build-og.mjs
          node --check site/seo.test.mjs
          node site/build-og.mjs
          node --test site/demo.test.mjs site/seo.test.mjs site/geist.test.mjs
      - name: Install Chromium for browser validation
        run: npx playwright install --with-deps chromium
      - name: Smoke test actual WebView and editor switching
        run: node --test site/demo/browser.test.mjs
      - name: Upload generated Workbench dependency lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-workbench-lock
          path: tools/pages-workbench/package-lock.json
          if-no-files-found: ignore
      - name: Upload workbench screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-demo-screenshots
          path: site-demo-*.png
          if-no-files-found: ignore
