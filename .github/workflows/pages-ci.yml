name: Validate product website

on:
  pull_request:
    paths:
      - 'site/**'
      - 'src/features/preview/**'
      - 'src/core/**'
      - 'package-lock.json'
      - 'tsconfig.webview.json'
      - 'README.md'
      - 'docs/marketing/**'
      - 'docs/agent-capability-catalog.md'
      - 'package.json'
      - '.github/workflows/pages-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked build dependencies
        run: npm ci --ignore-scripts
      - name: Bundle actual Preview and Monaco
        run: node site/build-demo.mjs
      - name: Validate site and generated social asset
        run: |
          node --check site/main.js
          node --check site/workbench.js
          node --check site/build-og.mjs
          node --check site/seo.test.mjs
          node site/build-og.mjs
          node --test site/demo.test.mjs site/seo.test.mjs
      - name: Install Chromium for browser validation
        run: npx playwright install --with-deps chromium
      - name: Smoke test actual WebView and editor switching
        run: node --test site/demo/browser.test.mjs
      - name: Upload workbench screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-demo-screenshots
          path: site-demo-*.png
          if-no-files-found: ignore
